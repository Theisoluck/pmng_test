spring.application.name=service
server.port=${DC_SERVER_PORT}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Conexion a MySQL. En Docker se define con variables de entorno (ver docker-compose.yml y .env.example)
db.host=${DC_DB_HOST}
db.port=${DC_DB_PORT}
db.name=${DC_DB_NAME}
db.user=${DC_DB_USER}
db.pass=${DC_DB_PASS}

# Origenes que pueden consumir la API desde el navegador
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://*:5173}
